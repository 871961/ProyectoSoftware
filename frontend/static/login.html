<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MedHistory</title>
    <!-- Tailwind CSS (local compiled) -->
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='18'>🏥</text></svg>">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-blue': '#2563EB',
                        'clinical-gray': '#F9FAFB',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-clinical-gray via-white to-blue-50 min-h-screen">

    <!-- Header -->
    <header class="backdrop-blur-sm bg-white/90 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-medical-blue rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <span class="text-xl font-semibold text-gray-900 tracking-tight">MedHistory</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-600 hover:text-medical-blue transition-colors font-medium">
                        Inicio
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
        <div class="max-w-md w-full">

            <!-- Login Card -->
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-sm border border-gray-100 p-8">

                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Iniciar Sesión</h1>
                    <p class="text-gray-600">Accede a tu cuenta profesional de MedHistory</p>
                </div>

                <!-- Role Selector -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 text-center">Tipo de cuenta</h3>
                    <div class="grid grid-cols-2 gap-3">

                        <!-- Paciente -->
                        <div id="role-patient"
                            class="role-card cursor-pointer p-4 rounded-xl border-2 border-medical-blue bg-blue-50 ring-4 ring-blue-100 transition-all duration-300 text-center"
                            data-role="paciente">
                            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center mx-auto mb-2">
                                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                        clip-rule="evenodd"></path>
                                </svg>
                            </div>
                            <h4 class="font-semibold text-gray-900 text-sm">Paciente</h4>
                        </div>

                        <!-- Médico -->
                        <div id="role-doctor"
                            class="role-card cursor-pointer p-4 rounded-xl border-2 border-gray-200 hover:border-medical-blue/50 transition-all duration-300 text-center"
                            data-role="medico">
                            <div class="w-8 h-8 bg-gray-400 rounded-lg flex items-center justify-center mx-auto mb-2">
                                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M10 2L3 7v11c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V7l-7-5z"></path>
                                </svg>
                            </div>
                            <h4 class="font-semibold text-gray-900 text-sm">Médico</h4>
                        </div>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                            Correo Electrónico <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-4 focus:ring-blue-100 focus:border-medical-blue transition-all duration-300 outline-none"
                            placeholder="tu@email.com" autocomplete="email">
                        <div id="email-error" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                            Contraseña <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required
                                class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-300 focus:ring-4 focus:ring-blue-100 focus:border-medical-blue transition-all duration-300 outline-none"
                                placeholder="Tu contraseña" autocomplete="current-password">
                            <button type="button" id="togglePassword"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                                <svg id="eyeOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                    </path>
                                </svg>
                                <svg id="eyeClosed" class="w-5 h-5 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21">
                                    </path>
                                </svg>
                            </button>
                        </div>
                        <div id="password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>

                    <!-- Remember & Forgot Password -->
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="remember" name="remember"
                                class="w-4 h-4 text-medical-blue border-gray-300 rounded focus:ring-blue-200">
                            <span class="text-gray-700">Recordarme</span>
                        </label>
                        <a href="#" class="text-medical-blue hover:text-blue-700 font-medium">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full bg-medical-blue hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-4 focus:ring-blue-200 shadow-lg hover:shadow-xl">
                        <span id="login-text" class="inline-flex items-center justify-center space-x-2">
                            <span>Iniciar Sesión</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                            </svg>
                        </span>
                        <div id="login-spinner" class="hidden">
                            <svg class="animate-spin w-5 h-5 mx-auto" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="m4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </div>
                    </button>

                    <!-- Hidden role input -->
                    <input type="hidden" id="userRole" name="role" value="paciente">
                </form>

                <!-- Register Link -->
                <div class="text-center mt-6">
                    <p class="text-gray-600">
                        ¿No tienes cuenta?
                        <a href="register.html"
                            class="text-medical-blue hover:text-blue-700 font-semibold transition-colors">
                            Créate una aquí
                        </a>
                    </p>
                </div>

                <!-- Status Messages -->
                <div id="success-message"
                    class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-center font-medium">
                </div>
                <div id="error-message"
                    class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-center font-medium">
                </div>
            </div>

            <!-- Legal Footer -->
            <div class="text-center mt-8">
                <p class="text-sm text-gray-500">
                    Sistema conforme a GDPR/LOPD para protección de datos médicos
                </p>
                <div class="flex justify-center space-x-4 mt-2 text-xs text-gray-400">
                    <a href="#" class="hover:text-gray-600 transition-colors">Política de Privacidad</a>
                    <span>|</span>
                    <a href="#" class="hover:text-gray-600 transition-colors">Términos de Uso</a>
                    <span>|</span>
                    <a href="#" class="hover:text-gray-600 transition-colors">Soporte</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>

</html>
