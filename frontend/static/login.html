<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MedHistory</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            min-height: 100vh;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
        }

        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
        }

        .auth-brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0f3460 0%, #1a4a7a 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px rgba(15, 52, 96, 0.15);
        }

        .auth-brand-icon i {
            width: 28px;
            height: 28px;
            color: white;
        }

        .auth-brand h1 {
            font-size: 1.875rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .auth-brand p {
            font-size: 0.9375rem;
            color: #64748b;
            text-align: center;
            line-height: 1.6;
        }

        .auth-form-wrapper {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-option {
            position: relative;
            cursor: pointer;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
        }

        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .role-option input:checked + .role-label {
            border-color: #0f3460;
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.05) 0%, rgba(15, 52, 96, 0.02) 100%);
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.08);
        }

        .role-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all 0.2s ease;
        }

        .role-option input:checked + .role-label .role-icon {
            background: #0f3460;
            color: white;
        }

        .role-text {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            transition: color 0.2s ease;
        }

        .role-option input:checked + .role-label .role-text {
            color: #0f3460;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9375rem;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            outline: none;
            border-color: #0f3460;
            background: white;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s ease;
            padding: 0.5rem;
        }

        .password-toggle:hover {
            color: #475569;
        }

        .password-wrapper {
            position: relative;
        }

        .form-group-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.8125rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0f3460;
        }

        .checkbox-wrapper label {
            cursor: pointer;
            color: #475569;
            font-weight: 500;
        }

        .forgot-link {
            color: #0f3460;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #1a4a7a;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #0f3460 0%, #1a4a7a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .submit-btn:hover {
            box-shadow: 0 8px 20px rgba(15, 52, 96, 0.25);
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9375rem;
            color: #475569;
        }

        .register-link a {
            color: #0f3460;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #1a4a7a;
        }

        .alert-box {
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .footer-text a {
            color: #475569;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-text a:hover {
            color: #0f172a;
        }

        .error-message {
            font-size: 0.75rem;
            color: #dc2626;
            margin-top: 0.5rem;
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand -->
            <div class="auth-brand">
                <div class="auth-brand-icon">
                    <i data-lucide="heart-pulse"></i>
                </div>
                <h1>MedHistory</h1>
                <p>Gestión inteligente de tu historial médico</p>
            </div>

            <!-- Form Card -->
            <div class="auth-form-wrapper">
                <!-- Role Selector -->
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" id="role-patient" name="role" value="paciente" checked>
                        <label for="role-patient" class="role-label">
                            <div class="role-icon">
                                <i data-lucide="user" style="width:20px;height:20px"></i>
                            </div>
                            <span class="role-text">Paciente</span>
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="role-doctor" name="role" value="medico">
                        <label for="role-doctor" class="role-label">
                            <div class="role-icon">
                                <i data-lucide="stethoscope" style="width:20px;height:20px"></i>
                            </div>
                            <span class="role-text">Médico</span>
                        </label>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" id="email" name="email" required class="form-input"
                            placeholder="tu@email.com" autocomplete="email">
                        <p id="email-error" class="error-message"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required class="form-input"
                                placeholder="Tu contraseña" autocomplete="current-password">
                            <button type="button" id="togglePassword" class="password-toggle">
                                <i id="eyeOpen" data-lucide="eye" style="width:18px;height:18px"></i>
                                <i id="eyeClosed" data-lucide="eye-off" style="width:18px;height:18px;display:none"></i>
                            </button>
                        </div>
                        <p id="password-error" class="error-message"></p>
                    </div>

                    <div class="form-group-row">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Recordarme en este dispositivo</label>
                        </div>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span id="login-text">Iniciar sesión</span>
                        <span id="login-spinner" style="display:none">
                            <i data-lucide="loader-circle" class="loading-spinner"></i>
                        </span>
                    </button>

                    <input type="hidden" id="userRole" name="role" value="paciente">
                </form>

                <!-- Alerts -->
                <div id="success-message" class="alert-box alert-success"></div>
                <div id="error-message" class="alert-box alert-error"></div>

                <!-- Register Link -->
                <p class="register-link">
                    ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
                </p>

                <!-- Footer -->
                <p class="footer-text">
                    Cumple con GDPR/LOPD · <a href="#">Privacidad</a> · <a href="#">Términos</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>

</html>
