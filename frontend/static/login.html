<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MedHistory</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
        }

        .auth-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr;
        }

        @media (min-width: 1024px) {
            .auth-shell {
                grid-template-columns: 1.1fr 1fr;
            }
        }

        /* Lateral oscuro de marca */
        .auth-aside {
            background: #0a1628;
            color: #f0f6ff;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .auth-aside::before {
            content: '';
            position: absolute;
            top: -120px;
            right: -120px;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, transparent 70%);
        }

        .auth-aside::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -80px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
        }

        @media (max-width: 1023px) {
            .auth-aside {
                display: none;
            }
        }

        .auth-form-wrap {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        .role-card {
            cursor: pointer;
            padding: 0.875rem;
            border: 2px solid #e5e7eb;
            background: #fff;
            border-radius: 0.75rem;
            text-align: center;
            transition: all 0.18s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .role-card:hover {
            border-color: #0f3460;
            background: #f8fafc;
        }

        .role-card.active {
            border-color: #0f3460;
            background: #eff6ff;
            box-shadow: 0 0 0 4px rgba(15, 52, 96, 0.08);
        }

        .role-card .role-icon {
            width: 36px;
            height: 36px;
            border-radius: 0.625rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #475569;
            transition: all 0.18s ease;
        }

        .role-card.active .role-icon {
            background: #0f3460;
            color: #fff;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 0.95rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 0.625rem;
            font-size: 0.9rem;
            color: #111827;
            background: #fff;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #0f3460;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
        }

        .auth-btn-primary {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.25rem;
            background: #0f3460;
            color: #fff;
            font-weight: 600;
            border-radius: 0.75rem;
            transition: background 0.15s ease;
        }

        .auth-btn-primary:hover {
            background: #1a4a7a;
        }

        .auth-feature {
            display: flex;
            gap: 0.85rem;
            align-items: flex-start;
            padding: 0.85rem 0;
        }

        .auth-feature-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="auth-shell">

        <!-- ASIDE: branding -->


        <!-- FORM: login -->
        <main class="auth-form-wrap">
            <div class="w-full" style="max-width:420px">
                <!-- Logo en mobile -->
                <div class="flex items-center gap-3 mb-8 lg:hidden">
                    <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i data-lucide="stethoscope" class="w-4 h-4 text-white"></i>
                    </div>
                    <span class="text-lg font-semibold text-gray-900">MedHistory</span>
                </div>

                <h1 class="text-2xl font-bold text-gray-900 mb-1">Iniciar sesión</h1>
                <p class="text-sm text-gray-500 mb-7">Accede a tu cuenta de MedHistory</p>

                <!-- Role selector -->
                <div class="mb-6">
                    <br>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div id="role-patient" class="role-card active" data-role="paciente">
                            <div class="role-icon"><i data-lucide="user" class="w-4 h-4"></i></div>
                            <span class="text-sm font-semibold text-gray-900">Paciente</span>
                        </div>
                        <div id="role-doctor" class="role-card" data-role="medico">
                            <div class="role-icon"><i data-lucide="stethoscope" class="w-4 h-4"></i></div>
                            <span class="text-sm font-semibold text-gray-900">Médico</span>
                        </div>
                    </div>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="email" class="block text-xs font-medium text-gray-500 mb-1.5">Correo
                            electrónico</label>
                        <input type="email" id="email" name="email" required class="form-input"
                            placeholder="tu@email.com" autocomplete="email">
                        <p id="email-error" class="text-xs text-red-500 mt-1.5 hidden"></p>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label for="password" class="text-xs font-medium text-gray-500">Contraseña</label>
                            <a href="#" class="text-xs font-medium" style="color:#0f3460">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="relative">
                            <input type="password" id="password" name="password" required class="form-input pr-11"
                                placeholder="Tu contraseña" autocomplete="current-password">
                            <button type="button" id="togglePassword"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-700 transition-colors">
                                <i id="eyeOpen" data-lucide="eye" class="w-4 h-4"></i>
                                <i id="eyeClosed" data-lucide="eye-off" class="w-4 h-4 hidden"></i>
                            </button>
                        </div>
                        <p id="password-error" class="text-xs text-red-500 mt-1.5 hidden"></p>
                    </div>

                    <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded border-gray-300"
                            style="accent-color:#0f3460">
                        Recordarme en este dispositivo
                    </label>

                    <button type="submit" class="auth-btn-primary mt-2">
                        <span id="login-text" class="inline-flex items-center justify-center gap-2">
                            Iniciar sesión
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </span>
                        <span id="login-spinner" class="hidden">
                            <i data-lucide="loader-circle" class="w-4 h-4 animate-spin"></i>
                        </span>
                    </button>

                    <input type="hidden" id="userRole" name="role" value="paciente">
                </form>

                <p class="text-center text-sm text-gray-600 mt-6">
                    ¿No tienes cuenta?
                    <a href="register.html" class="font-semibold transition-colors hover:underline"
                        style="color:#0f3460">
                        Regístrate
                    </a>
                </p>

                <div id="success-message"
                    class="hidden mt-5 p-3.5 rounded-xl text-sm text-green-700 font-medium text-center"
                    style="background:#f0fdf4;border:1px solid #bbf7d0"></div>
                <div id="error-message"
                    class="hidden mt-5 p-3.5 rounded-xl text-sm text-red-700 font-medium text-center"
                    style="background:#fef2f2;border:1px solid #fecaca"></div>

                <p class="text-center text-[11px] text-gray-400 mt-8">
                    Sistema conforme a GDPR/LOPD ·
                    <a href="#" class="hover:text-gray-600">Privacidad</a> ·
                    <a href="#" class="hover:text-gray-600">Términos</a>
                </p>
            </div>
        </main>
    </div>

    <script src="js/login.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>

</html>
