<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-4">Test Formulario de Registro</h1>

        <div id="error-debug" class="mb-4 p-4 bg-red-50 border border-red-200 rounded hidden">
            <strong>Error:</strong> <span id="error-text"></span>
        </div>

        <form id="registrationForm" class="hidden">
            <div id="formFields"></div>
        </form>

        <div id="status" class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded">
            Cargando...
        </div>
    </div>

    <script>
        // Test simple
        console.log('Script cargado');

        document.addEventListener('DOMContentLoaded', function () {
            console.log('DOM cargado');

            try {
                const registrationForm = document.getElementById('registrationForm');
                const formFields = document.getElementById('formFields');
                const status = document.getElementById('status');

                console.log('Elementos encontrados:', {
                    form: !!registrationForm,
                    fields: !!formFields,
                    status: !!status
                });

                if (!registrationForm || !formFields) {
                    throw new Error('No se encontraron los elementos del formulario');
                }

                // Generar formulario de prueba
                formFields.innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <label class="block">DNI/NIE:</label>
                            <input type="text" name="dni" required maxlength="9" 
                                   class="w-full border p-2 rounded" placeholder="12345678A">
                        </div>
                        <div>
                            <label class="block">Nombre:</label>
                            <input type="text" name="nombre" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block">Apellidos:</label>
                            <input type="text" name="apellidos" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block">Email:</label>
                            <input type="email" name="email" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block">Teléfono:</label>
                            <input type="tel" name="telefono" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block">Dirección:</label>
                            <input type="text" name="direccion" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block">Fecha de Nacimiento:</label>
                            <input type="date" name="fecha_nacimiento" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block">Contraseña:</label>
                            <input type="password" name="password" required 
                                   class="w-full border p-2 rounded">
                        </div>
                        <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded hover:bg-blue-600">
                            Registrar
                        </button>
                    </div>
                `;

                // Mostrar formulario
                registrationForm.classList.remove('hidden');
                status.textContent = '✓ Formulario cargado correctamente';
                status.className = 'mt-4 p-4 bg-green-50 border border-green-200 rounded text-green-700';

                console.log('Formulario generado exitosamente');

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error-debug').classList.remove('hidden');
                document.getElementById('error-text').textContent = error.message;
                status.textContent = '✗ Error al cargar el formulario';
                status.className = 'mt-4 p-4 bg-red-50 border border-red-200 rounded text-red-700';
            }
        });
    </script>
</body>

</html>
