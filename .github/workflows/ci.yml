name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci
          npm run build:frontend

      - name: Upload compiled CSS artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-css
          path: frontend/static/css/tailwind.css
